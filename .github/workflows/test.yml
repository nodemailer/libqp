name: Run tests

on:
    push:
    pull_request:

permissions:
    contents: read

jobs:
    test:
        strategy:
            matrix:
                node: [20.x, 22.x, 24.x, 26.x]
                os: [ubuntu-latest]
        runs-on: ${{ matrix.os }}
        steps:
            - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
            - name: Use Node.js ${{ matrix.node }}
              uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
              with:
                  node-version: ${{ matrix.node }}
            - run: npm install
            - run: npm run lint
            - run: npm run format:check
            - run: npm test

    # The library is used from Bun as well: the ES module build and the same test
    # suite are run under the latest Bun release
    bun:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
            - name: Use Node.js 24.x
              uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
              with:
                  node-version: 24.x
            - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
              with:
                  bun-version: 1.4.3
            - run: npm install
            - run: npm run test:bun

    # Coverage is gated on a single Node.js version, the numbers are the same across versions
    coverage:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
            - name: Use Node.js 24.x
              uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
              with:
                  node-version: 24.x
            - run: npm install
            - run: npm run test:coverage
